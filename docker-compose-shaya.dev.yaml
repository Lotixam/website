name: lotixam

services:
  web:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
    image: lotixam-php-apache:local
    container_name: lotixam_web
    working_dir: /var/www/html
    command:
      - bash
      - -lc
      - |
        set -e
        sed -ri 's#DocumentRoot /var/www/html#DocumentRoot /var/www/html/public#g' /etc/apache2/sites-available/000-default.conf
        sed -ri 's#<Directory /var/www/>#<Directory /var/www/html/public/>#g' /etc/apache2/sites-available/000-default.conf
        sed -ri 's#<Directory /var/www/html/>#<Directory /var/www/html/public/>#g' /etc/apache2/sites-available/000-default.conf
        sed -ri 's/AllowOverride None/AllowOverride All/' /etc/apache2/sites-available/000-default.conf
        a2enmod rewrite
        cd /var/www/html
        mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs storage/app/public storage/framework/tmp bootstrap/cache
        chown -R www-data:www-data storage bootstrap/cache
        chmod -R u+rwX,g+rwX storage bootstrap/cache
        exec apache2-foreground
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TMPDIR: /var/www/html/storage/framework/tmp
    networks:
      - lotixam_internal
      - dev_gateway_net

  mysql:
    image: mysql:8.4
    container_name: lotixam_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    volumes:
      - lotixam_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - lotixam_internal

volumes:
  lotixam_mysql_data:

networks:
  lotixam_internal:
    driver: bridge
  dev_gateway_net:
    external: true
